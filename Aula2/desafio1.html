    <script>
        const tags_p = document.getElementsByTagName('p')
        console.log(tags_p);
        let tag_p_1 = tags_p[0]
        console.log(tag_p_1);
        tag_p_1.style.backgroundColor="green";
        tag_p_1.style.color="white";
        tag_p_1.style.textAlign="center";
        tag_p_1.style.fontSize="25pt";

        let tag_p_2 = tags_p[1]

        console.log(tag_p_3);

        tag_p_3.style.color="red";

        tag_p_3.style.fontSize="15pt";
        
        tag_p_3.innerText = "A turma do DEV é espetacular demais!"

        const tags_div = document.getElementsByTagName('div')
        console.log(tags_div);
        let tag_div_1 = tags_div[0]
        console.log(tag_div_1);
        tag_div_1.style.backgroundColor="yellow";

        console.log(tags_body);
